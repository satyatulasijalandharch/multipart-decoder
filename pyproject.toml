[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "multipart-decoder"
dynamic = ["version"]
authors = [
  { name="Satya Tulasi Jalandhar C H", email="satyatulasijalandharch2@gmail.com" },
]
description = "A lightweight Python package for parsing multipart/form-data content"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests_toolbelt==1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE*"]

[tool.setuptools.dynamic]
version = {attr = "multipart_decoder.__version__"}

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[project.urls]
Homepage = "https://github.com/satyatulasijalandharch/multipart-decoder"
Issues = "https://github.com/satyatulasijalandharch/multipart-decoder/issues"